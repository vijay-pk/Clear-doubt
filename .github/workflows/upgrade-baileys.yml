# One-off: upgrade Baileys (WhatsApp Web) and regenerate package-lock.json.
# Builds the whole app first; only commits if the build passes. Removes itself.
name: Upgrade Baileys
on:
  push:
    branches: [main]
    paths: [".github/workflows/upgrade-baileys.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Upgrade Baileys to 6.7.24
        run: |
          npm install @whiskeysockets/baileys@6.7.24 --workspace server --save-exact --no-audit --no-fund
          npm install --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Build (server + web, includes type-check)
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          tail -40 build.log
          if [ $code -ne 0 ]; then
            grep -E "error|TS[0-9]{4}" build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $code
      - name: Commit lockfile and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/upgrade-baileys.yml
          git add package.json package-lock.json server/package.json
          git commit -m "Upgrade Baileys to 6.7.24 (WhatsApp delivery fix, security advisory GHSA-qvv5-jq5g-4cgg)"
          git push
